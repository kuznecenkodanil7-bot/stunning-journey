package com.raidminer.helper.rules;

import java.util.List;

public final class PunishmentRules {
    private PunishmentRules() {}

    public static final PunishmentRule WARN_2_1 = new PunishmentRule(
            PunishmentType.WARN,
            "2.1",
            "предупреждение",
            List.of(),
            "",
            "2.1"
    );

    public static List<PunishmentRule> muteRules() {
        return List.of(
                rule(PunishmentType.MUTE, "2.2", "оскорбление кого-либо/чего-либо", List.of("1h", "2h", "6h", "12h", "1d", "3d", "7d")),
                rule(PunishmentType.MUTE, "2.3", "оскорбление родных", List.of("1d", "3d", "5d", "15d")),
                fixed(PunishmentType.MUTE, "2.4", "сообщения сексуального характера", "2h"),
                fixed(PunishmentType.MUTE, "2.5", "неадекватное поведение", "2h"),
                fixed(PunishmentType.MUTE, "2.6", "реклама серверов и сторонних ресурсов", "1d"),
                fixed(PunishmentType.MUTE, "2.7", "пропаганда/агитация ненависти и вражды", "9h"),
                rule(PunishmentType.MUTE, "2.8", "сторонние ссылки/реклама стримов и видео", List.of("8h", "1d", "3d")),
                fixed(PunishmentType.MUTE, "2.9", "выдача себя за администратора", "12h"),
                fixed(PunishmentType.MUTE, "2.10", "угрозы вне игрового процесса", "12h"),
                fixed(PunishmentType.MUTE, "2.11", "угроза наказанием без причины", "6h"),
                rule(PunishmentType.MUTE, "2.12", "обсуждение политики", List.of("12h", "1d", "3d", "7d")),
                fixed(PunishmentType.MUTE, "2.13", "введение игроков в заблуждение", "2h"),
                fixed(PunishmentType.MUTE, "2.14", "попрошайничество у администрации", "6h"),
                fixed(PunishmentType.MUTE, "2.15", "помехи в голосовом чате", "4h")
        );
    }

    public static List<PunishmentRule> banRules() {
        return List.of(
                rule(PunishmentType.BAN, "2.2", "оскорбление кого-либо/чего-либо", List.of("1d", "2d", "3d", "7d")),
                rule(PunishmentType.BAN, "2.3", "оскорбление родных", List.of("3d", "7d", "15d")),
                rule(PunishmentType.BAN, "2.6", "реклама серверов и сторонних ресурсов", List.of("1d", "7d", "14d")),
                fixed(PunishmentType.BAN, "2.7", "пропаганда/агитация ненависти и вражды", "3d"),
                noDuration(PunishmentType.BAN, "3.1", "некорректный ник", "некорректный ник"),
                rule(PunishmentType.BAN, "4.1", "нет доказательств при выдаче наказания", List.of("5d", "15d", "20d", "30d"))
        );
    }

    public static List<PunishmentRule> ipbanRules() {
        return List.of(
                noDuration(PunishmentType.IPBAN, "бот", "бот", "бот"),
                fixed(PunishmentType.IPBAN, "уход от проверки", "уход от проверки", "30d"),
                fixed(PunishmentType.IPBAN, "время вышло", "время вышло", "30d"),
                fixed(PunishmentType.IPBAN, "неадекватное поведение во время проверки", "неадекватное поведение во время проверки", "30d"),
                fixed(PunishmentType.IPBAN, "признание", "признание", "20d"),
                fixed(PunishmentType.IPBAN, "3.3", "торговля за реальные деньги", "30d"),
                rule(PunishmentType.IPBAN, "3.6", "баги сервера/лаг-машины", List.of("1d", "7d", "15d")),
                rule(PunishmentType.IPBAN, "3.7", "использование/хранение стороннего ПО", List.of("7d", "15d", "20d", "30d")),
                fixed(PunishmentType.IPBAN, "3.8", "обход бана за читы", "30d"),
                fixed(PunishmentType.IPBAN, "3.9", "подстрекательство к нарушению правил", "3d"),
                fixed(PunishmentType.IPBAN, "3.10", "тим с игроком со сторонним ПО", "15d")
        );
    }

    private static PunishmentRule rule(PunishmentType type, String code, String title, List<String> durations) {
        return new PunishmentRule(type, code, title, durations, "", code);
    }

    private static PunishmentRule fixed(PunishmentType type, String code, String title, String duration) {
        return new PunishmentRule(type, code, title, List.of(), duration, code);
    }

    private static PunishmentRule noDuration(PunishmentType type, String code, String title, String commandReason) {
        return new PunishmentRule(type, code, title, List.of(), "", commandReason);
    }
}
